name: e_commerce
description: >-
  A production-ready Flutter e-commerce UI template with onboarding, authentication,
  shop browsing, cart, checkout, wishlist, and user profile screens. Built with GetX,
  light/dark themes, and reusable widgets. Connect your own backend API to go live.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Utility
  http: ^1.1.2
  intl: ^0.19.0
  logger: ^2.0.2+1
  url_launcher: ^6.2.3
  flutter_native_splash: ^2.3.9
  smooth_page_indicator: ^1.1.0

  # Icons
  cupertino_icons: ^1.0.6
  iconsax: ^0.0.8

  # State management
  get: ^4.6.6
  get_storage: ^2.1.1

  # UI
  readmore: ^2.2.0
  carousel_slider: ^5.1.2
  flutter_rating_bar: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/brands/lgo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icons/brands/lgo.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
  windows:
    generate: true
    image_path: "assets/icons/brands/lgo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icons/brands/lgo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/brands/
    - assets/images/on_boarding_images/
    - assets/logos/
    - assets/images/animations/
    - assets/icons/categories/
    - assets/images/banners/
    - assets/images/products/
    - assets/images/users/
    - assets/images/reviews/
    - assets/images/payment/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Italic.ttf
          style: italic
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-MediumItalic.ttf
          style: italic
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 800
